<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연정이와 교복 이야기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #b9dcf7;
      --sky-bottom: #eef6fd;
      --navy: #1f3557;
      --pink: #e2557f;
      --pink-soft: #f9d3df;
      --card: #ffffff;
      --sub: #4f5f78;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--navy);
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%, #ffffff 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 배경 구름 */
    .cloud {
      position: fixed;
      background: #ffffff;
      border-radius: 999px;
      opacity: 0.85;
      filter: blur(1px);
      z-index: 0;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
    }
    .cloud.c1 { width: 220px; height: 60px; top: 60px; left: -40px; }
    .cloud.c1::before { width: 110px; height: 110px; top: -55px; left: 40px; }
    .cloud.c1::after { width: 80px; height: 80px; top: -35px; left: 120px; }
    .cloud.c2 { width: 260px; height: 70px; top: 140px; right: -60px; }
    .cloud.c2::before { width: 130px; height: 130px; top: -65px; left: 50px; }
    .cloud.c2::after { width: 90px; height: 90px; top: -40px; left: 150px; }
    .cloud.c3 { width: 180px; height: 50px; bottom: 80px; left: 8%; opacity: 0.6; }
    .cloud.c3::before { width: 90px; height: 90px; top: -45px; left: 30px; }
    .cloud.c3::after { width: 60px; height: 60px; top: -25px; left: 100px; }

    /* 연꽃 장식 */
    .lotus {
      position: fixed;
      z-index: 0;
      opacity: 0.55;
      pointer-events: none;
    }
    .lotus.l1 { width: 90px; bottom: 24px; right: 24px; }
    .lotus.l2 { width: 60px; top: 24px; left: 46%; opacity: 0.35; }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 16px;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* 상단 소개 */
    .intro {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 6px 18px rgba(226, 85, 127, 0.25);
      flex-shrink: 0;
      background: var(--pink-soft);
    }
    .title-small {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 1.5rem;
      color: var(--pink);
      margin: 0;
      line-height: 1;
    }
    .title {
      font-weight: 900;
      font-size: 1.45rem;
      margin: 4px 0 2px;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    .title em {
      font-style: normal;
      color: var(--pink);
    }
    .school {
      font-size: 0.8rem;
      color: var(--sub);
      margin: 0;
    }

    .poster { display: none; }
    .title, .title-small, footer { word-break: keep-all; }
    @media (max-width: 899px) {
      .lotus.l2 { display: none; }
      .title { font-size: 1.25rem; }
      .chat-head span { display: none; }
      footer { font-size: 1.1rem; }
    }

    /* 채팅 카드 */
    .chat-card {
      background: var(--card);
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(31, 53, 87, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 72vh;
      border: 3px solid #ffffff;
    }
    .chat-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(90deg, var(--pink-soft), #fdeef3);
      font-weight: 700;
      font-size: 0.95rem;
    }
    .chat-head img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
    }
    .chat-head span {
      font-family: 'Nanum Pen Script', cursive;
      font-weight: 400;
      font-size: 1.25rem;
      color: var(--pink);
      margin-left: auto;
    }
    .chat-card iframe {
      flex: 1;
      width: 100%;
      min-height: 520px;
      border: 0;
      display: block;
    }

    footer {
      text-align: center;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 1.3rem;
      color: var(--sub);
      padding-bottom: 8px;
    }

    /* 넓은 화면: 왼쪽 포스터, 오른쪽 채팅 */
    @media (min-width: 900px) {
      .wrap {
        grid-template-columns: 1fr 1.05fr;
        grid-template-areas:
          "poster intro"
          "poster chat"
          "footer footer";
        grid-template-rows: auto 1fr auto;
        column-gap: 32px;
        padding: 36px 24px;
      }
      .intro { grid-area: intro; }
      .chat-card { grid-area: chat; min-height: 560px; }
      footer { grid-area: footer; }
      .poster {
        display: block;
        grid-area: poster;
        align-self: start;
        position: sticky;
        top: 36px;
      }
      .poster img {
        width: 100%;
        border-radius: 24px;
        border: 6px solid #ffffff;
        box-shadow: 0 14px 36px rgba(31, 53, 87, 0.2);
        display: block;
        transform: rotate(-1.5deg);
      }
      .poster p {
        font-family: 'Nanum Pen Script', cursive;
        font-size: 1.6rem;
        color: var(--pink);
        text-align: center;
        margin: 18px 0 0;
      }
      .avatar { width: 92px; height: 92px; }
      .title { font-size: 1.9rem; }
    }
  </style>
</head>
